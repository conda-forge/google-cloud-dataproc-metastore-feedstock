schema_version: 1

context:
  name: google-cloud-dataproc-metastore
  version: "1.24.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_dataproc_metastore-${{ version }}.tar.gz
  sha256: e1dffc76596ee1c6a7f5688f88b4faec65f2cbe45310d3a808e70ac3c17beb52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0

tests:
  - python:
      imports:
        - google.cloud.metastore_v1
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Dataproc Metastore API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-dataproc-metastore
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-dataproc-metastore
  documentation: https://cloud.google.com/dataproc-metastore/docs

extra:
  recipe-maintainers:
    - xylar
